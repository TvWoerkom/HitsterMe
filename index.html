<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify API Token Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Montserrat', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
      font-weight: 700;
    }
    
    #container {
      width: 100%;
      max-width: 600px;
      background: linear-gradient(135deg, #1db954 0%, #1ed760 100%);
      border-radius: 20px;
      padding: 50px 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(29, 185, 84, 0.3);
    }
    
    #container h1 {
      color: #000;
      margin-bottom: 40px;
    }
    
    button {
      padding: 15px 30px;
      background: #000;
      color: #1db954;
      border: 2px solid #000;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Montserrat', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 10px 5px;
    }
    
    button:hover {
      background: #1db954;
      color: #000;
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    
    #result {
      margin-top: 20px;
      font-size: 0.95rem;
      color: #000;
      font-weight: 600;
    }
    
    #nextBtn {
      display: none;
      margin-top: 20px;
    }
    
    @media (max-width: 768px) {
      h1 {
        font-size: 1.5rem;
      }
      
      #container {
        padding: 35px 20px;
      }
      
      button {
        padding: 12px 24px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>Please login to Spotify to get started</h1>
    <button id="getTokenBtn">Login here</button>
    <div id="result"></div>
    <button id="nextBtn" onclick="window.location.href = '{{url_for('qr_coding')}}';">Go to QR Code Scanner</button>
  </div>

  <script src="spotify.js"></script>
</body>
</html>
