<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Montserrat', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      max-width: 500px;
      width: 100%;
      background: linear-gradient(135deg, #1db954 0%, #1ed760 100%);
      border-radius: 20px;
      padding: 50px 30px;
      box-shadow: 0 20px 60px rgba(29, 185, 84, 0.3);
      text-align: center;
    }
    
    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      font-weight: 700;
      color: #000;
    }
    
    .subtitle {
      color: rgba(0, 0, 0, 0.7);
      font-size: 0.95rem;
      margin-bottom: 40px;
    }
    
    .camera-wrapper {
      width: 100%;
      margin: 0 auto 20px;
    }
    
    #camera-container {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      border: 4px solid #000;
      padding: 0;
    }
    
    video {
      width: 100%;
      display: block;
      background: #000;
    }
    
    #message {
      color: #000;
      font-size: 0.95rem;
      margin: 20px 0;
      font-weight: 600;
      min-height: 30px;
      display: none;
    }
    
    .controls-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    
    .button {
      display: none;
      padding: 15px 30px;
      background: #000;
      color: #1db954;
      border: 2px solid #000;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Montserrat', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .button:hover {
      background: #1db954;
      color: #000;
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 35px 20px;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .button {
        padding: 12px 24px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="h1">Scan a QR Code</h1>

    <div class="camera-wrapper">
      <div id="camera-container">
        <video id="camera-feed" autoplay></video>
      </div>
    </div>

    <div id="message"></div>

    <!-- Music Controls -->
    <div class="controls-container">
      <button id="play-pause-btn" class="button">▶ Play</button>
      <button id="restart-btn" class="button">↻ Restart</button>
      <button id="next-button" class="button" onclick="startNextScan()">Next</button>
    </div>
  </div>

  <!-- Include QR Code Scanner -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.min.js"></script>
  
  <!-- Include Spotify Functions -->
  <script src="spotify.js"></script>
  
  <!-- Include Camera Feed and QR Code Scanner Logic -->
  <script src="camera.js"></script>
  <script src="qrScanner.js"></script>
  <script src="playpauserestart.js"></script>

</body>
</html>
